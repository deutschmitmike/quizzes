<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lehrer-Übersicht</title>
<style>
  :root{ --der:#2D6CDF; --die:#E0467C; --das:#1FA85C; --bg:#F4F6FB; --card:#fff; --ink:#1F2A44; --muted:#7A86A1; --warn:#C77F0E; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink);}
  main{max-width:860px; margin:0 auto; padding:16px;}
  h1{font-size:24px; margin:8px 0 4px;} .sub{color:var(--muted); font-size:14px; margin:0 0 16px;}
  .group{background:var(--card); border-radius:16px; padding:16px; margin:0 0 16px; box-shadow:0 2px 8px rgba(31,42,68,.06);}
  .group h2{font-size:19px; margin:0 0 4px;} .links{font-size:13px; margin:0 0 10px;} .links a{color:var(--der); margin-right:12px;}
  .focus{background:#f2f6ff; border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:14px;}
  .focus b{display:block; margin-bottom:6px;} .btns{display:flex; flex-wrap:wrap; gap:6px;}
  button{border:none; border-radius:10px; padding:7px 11px; font:inherit; font-size:13px; font-weight:700; background:#e7ebf5; color:var(--ink); cursor:pointer;}
  button.on{background:var(--der); color:#fff;}
  .kids{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px;}
  .kid{border:1px solid #e7ebf5; border-radius:12px; padding:12px; font-size:14px;}
  .kid .n{font-size:17px; font-weight:800;} .kid .row{display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dashed #eef0f6;}
  .kid .row span:first-child{color:var(--muted);} .warn{color:var(--warn); font-weight:700;}
  .prob{margin-top:6px; font-size:13px; color:var(--muted);} .empty{color:var(--muted); font-size:14px;}
</style></head>
<body><main>
<h1>Lehrer-Übersicht</h1>
<p class="sub">Alle Schüler aller Gruppen. Daten aus der Online-Sicherung, Stand beim Öffnen der Seite.</p>
<div id="root">lädt ...</div>
<div class="group"><h2>Kyla · Englisch</h2><div class="links"><a href="../english/lehrer.html">Sätze ansehen und korrigieren</a><a href="../english/">Kylas App</a></div></div>
</main>
<script>
"use strict";
const META=[{"id": "kyana", "name": "der, die, das (Kyana)", "folder": "der-die-das", "lbPath": "lb", "savePath": "save", "focusOpts": [[2, "Mehrzahl"], [3, "Wo oder Wohin?"], [4, "Dativ-Wörter"], [5, "Akkusativ-Wörter"], [6, "Welcher Fall?"], [7, "er, sie, es"], [8, "mein oder meine?"], [9, "sein oder ihr?"], [10, "ihn, sie, es"], [11, "Adjektive: der oder ein?"], [12, "Adjektive im Akkusativ"], [13, "Adjektive im Dativ"], [14, "Adjektive gemischt"]], "weg": ["t23:", "t24:", "p:Geld$", "p:Papier$", "p:Spaß$", "p:Hilfe$", "p:Luft$", "p:Himmel$", "p:Haut$", "p:Ordnung$", "p:Schluss$", "p:Honig$", "p:Öl$", "p:Schokolade$", "p:Marmelade$", "p:Müsli$", "p:Kreide$", "p:Pappe$", "p:Asche$", "p:Brühe$", "p:Seide$", "p:Teig$", "p:Tinte$", "p:Wachs$", "p:Lack$", "p:Garn$", "p:Kompost$", "p:Getreide$", "p:Pulver$", "p:Sprudel$", "p:Gemüse$", "p:Geschirr$", "p:Besteck$", "p:Donner$", "p:Nebel$", "p:Frost$", "p:Dampf$", "p:Glut$", "p:Grippe$", "p:Freude$", "p:Not$", "po:Sonne$", "po:Kind$", "ps:Kind$", "ps:Sonne$", "p:Brust$", "p:Mops$", "p:Fett$", "p:Unkraut$", "p:Moos$", "p:Schoß$", "p:Strom$", "p:Mittag$"]}, {"id": "marta", "name": "Marta", "folder": "marta", "lbPath": "lb/__marta", "savePath": "save/__marta", "focusOpts": [[2, "Mehrzahl"], [3, "Wo oder Wohin?"], [4, "Dativ-Wörter"], [5, "Akkusativ-Wörter"], [6, "Welcher Fall?"], [7, "er, sie, es"], [8, "mein oder meine?"], [9, "sein oder ihr?"], [10, "ihn, sie, es"], [11, "Adjektive: der oder ein?"], [12, "Adjektive im Akkusativ"], [13, "Adjektive im Dativ"], [14, "Adjektive gemischt"]], "weg": ["t23:", "t24:", "p:Geld$", "p:Papier$", "p:Spaß$", "p:Hilfe$", "p:Luft$", "p:Himmel$", "p:Haut$", "p:Ordnung$", "p:Schluss$", "p:Honig$", "p:Öl$", "p:Schokolade$", "p:Marmelade$", "p:Müsli$", "p:Kreide$", "p:Pappe$", "p:Asche$", "p:Brühe$", "p:Seide$", "p:Teig$", "p:Tinte$", "p:Wachs$", "p:Lack$", "p:Garn$", "p:Kompost$", "p:Getreide$", "p:Pulver$", "p:Sprudel$", "p:Gemüse$", "p:Geschirr$", "p:Besteck$", "p:Donner$", "p:Nebel$", "p:Frost$", "p:Dampf$", "p:Glut$", "p:Grippe$", "p:Freude$", "p:Not$", "po:Sonne$", "po:Kind$", "ps:Kind$", "ps:Sonne$", "p:Brust$", "p:Mops$", "p:Fett$", "p:Unkraut$", "p:Moos$", "p:Schoß$", "p:Strom$", "p:Mittag$"]}, {"id": "mia-olivia", "name": "Mia & Olivia", "folder": "mia-olivia", "lbPath": "lb/__mia_olivia", "savePath": "save/__mia_olivia", "focusOpts": [[1, "Artikel"], [2, "Plural"], [3, "Präpositionen"], [7, "Pronomen"], [11, "Adjektive"], [15, "Perfekt/Präteritum"], [17, "Präsens/Modalverben"], [19, "Nebensätze"], [20, "Komparativ"], [21, "Satzbau"], [22, "Pronomen Dativ"], [25, "Relativsätze"]], "weg": ["t23:", "t24:", "p:Geld$", "p:Papier$", "p:Spaß$", "p:Hilfe$", "p:Luft$", "p:Himmel$", "p:Haut$", "p:Ordnung$", "p:Schluss$", "p:Honig$", "p:Öl$", "p:Schokolade$", "p:Marmelade$", "p:Müsli$", "p:Kreide$", "p:Pappe$", "p:Asche$", "p:Brühe$", "p:Seide$", "p:Teig$", "p:Tinte$", "p:Wachs$", "p:Lack$", "p:Garn$", "p:Kompost$", "p:Getreide$", "p:Pulver$", "p:Sprudel$", "p:Gemüse$", "p:Geschirr$", "p:Besteck$", "p:Donner$", "p:Nebel$", "p:Frost$", "p:Dampf$", "p:Glut$", "p:Grippe$", "p:Freude$", "p:Not$", "p:Brust$", "p:Mops$", "p:Fett$", "p:Unkraut$", "p:Moos$", "p:Schoß$", "d:1:Freundin$", "d:1:Mutter$", "d:6:Freundin$", "d:12:Freund$", "d:12:Freundin$", "d:12:Schwester$", "d:14:Freund$", "d:15:Bruder$", "d:18:Mutter$", "d:18:Vater$", "d:20:Bruder$", "d:20:Schwester$", "d:23:Freundin$", "d:26:Schwester$", "d:26:Freundin$", "a:0:Mutter$", "a:0:Vater$", "a:0:Freundin$", "a:5:Bruder$", "a:5:Schwester$", "a:5:Freundin$", "a:16:Freund$", "a:16:Mutter$", "a:19:Freundin$", "a:21:Bruder$", "a:21:Schwester$", "m:d1:Freundin$", "m:d1:Mutter$", "m:d6:Freundin$", "m:a0:Mutter$", "m:a0:Vater$", "m:a0:Freundin$", "m:a5:Bruder$", "m:a5:Schwester$", "m:a5:Freundin$", "p:Strom$", "p:Mittag$"]}];
const DB="https://ddd-spiel-default-rtdb.europe-west1.firebasedatabase.app/";
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
const esc=s=>String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const KIND={g:"Artikel",p:"Plural",w:"Wo/Wohin",d:"Dativ",a:"Akkusativ",m:"Fall gemischt",pr:"er/sie/es",po:"mein/meine",ps:"sein/ihr",pa:"ihn/sie/es",adj:"Adjektiv",pf:"Perfekt",pt:"Präteritum",vp:"Präsens",vm:"Modalverb",ns:"Nebensatz",ko:"Komparativ",t21:"Satzbau",t22:"mir/mich",t23:"reflexiv",t24:"Konjunktiv II",t25:"Relativsatz"};
function label(id){ const p=id.split(":"), k=p[0], t=KIND[k]||k;
  if(/^t\d+$/.test(k)) return t+"-Satz";   // Satzkarten: ID ist eine Pruefsumme
  if(k==="adj") return p[4]+" "+p[5]+" ("+t+")"; if(k==="ns") return t+" "+(+p[1]+1); if(k==="ko") return p[1]+" ("+(p[2]==="S"?"Superlativ":"Komparativ")+")";
  return p[p.length-1]+" ("+t+")"; }
function kidHtml(S,g){ const WEG=(g&&g.weg)||[];   // entfernte Themen dieser Gruppe (src/tests/entfernt.txt) nicht mitzaehlen
  const t=today(), cards=Object.entries(S.cards||{}).filter(([id])=>!WEG.some(w=>w.endsWith("$")?id===w.slice(0,-1):id.startsWith(w))), sicher=cards.filter(([,c])=>(c.box||0)>=4).length;
  const st=S.stats||{}, acc=st.attempts?Math.round(100*st.firstRight/st.attempts)+" %":"–";
  const log=(Array.isArray(S.log)?S.log:Object.values(S.log||{})).filter(L=>L&&L.d>t-7), n7=log.reduce((a,L)=>a+L.n,0), ok7=log.reduce((a,L)=>a+L.ok,0);
  const lastD=Math.max(S.lastDay!=null?S.lastDay:-1,...(Array.isArray(S.log)?S.log:Object.values(S.log||{})).filter(Boolean).map(L=>L.d||-1)), ago=lastD>=0?t-lastD:null,   /* auch abgebrochene Runden zaehlen */ agoTxt=ago==null?"noch nie":ago===0?"heute":ago===1?"gestern":"vor "+ago+" Tagen";
  const prob=cards.filter(([,c])=>(c.miss||0)>=2).sort((a,b)=>b[1].miss-a[1].miss).slice(0,6).map(([id,c])=>esc(label(id))+" ("+c.miss+")");
  const row=(k,v,w)=>'<div class="row"><span>'+k+'</span><span'+(w?' class="warn"':'')+'>'+v+'</span></div>';
  return '<div class="kid"><div class="n">'+esc(S.playerName)+'</div>'
    +row("zuletzt geübt",agoTxt,ago==null||ago>3)
    +row("letzte 7 Tage",S.log?(log.length+" Tage, "+n7+" Karten"+(n7?", "+Math.round(100*ok7/n7)+" %":"")):"(noch keine Tagesdaten)",S.log&&log.length<3)
    +row("Übungstage gesamt",S.streak||0)+row("Karten gesehen / sicher",cards.length+" / "+sicher)+row("Treffer 1. Versuch gesamt",acc)
    +(prob.length?'<div class="prob">Hängt: '+prob.join(", ")+'</div>':"")+'</div>'; }
function focusHtml(g,fo){ const cur=(fo&&fo.stage&&fo.until>=today())?fo:null;
  return '<div class="focus"><b>Schwerpunkt: '+(cur?esc(cur.name)+" (noch "+(cur.until-today())+" Tage)":"keiner")+'</b><div class="btns">'
    +g.focusOpts.map(o=>'<button data-g="'+g.id+'" data-s="'+o[0]+'" data-n="'+esc(o[1])+'"'+(cur&&cur.stage===o[0]?' class="on"':'')+'>'+esc(o[1])+'</button>').join("")
    +'<button data-g="'+g.id+'" data-s="0">kein Schwerpunkt</button></div></div>'; }
// Kyana-Gruppe liegt direkt in save/: nur ihre Spielstaende laden, nicht die Unterordner anderer Gruppen (save/__…, z. B. Kylas Tonaufnahmen)
async function holeSaves(p){ const j=async u=>(await fetch(DB+u+(u.includes("?")?"&":"?")+"t="+Date.now())).json();
  if(p!=="save") return (await j(p+".json"))||{};
  const keys=Object.keys((await j("save.json?shallow=true"))||{}).filter(k=>!k.startsWith("__")), o={};
  await Promise.all(keys.map(async k=>{ o[k]=await j("save/"+encodeURIComponent(k)+".json"); })); return o; }
async function load(){ const root=document.getElementById("root"); let html="";
  for(const g of META){ let saves={}, fo=null;
    try{ saves=await holeSaves(g.savePath); fo=await (await fetch(DB+g.lbPath+"/_focus.json?t="+Date.now())).json(); }catch(e){ html+='<div class="group"><h2>'+esc(g.name)+'</h2><p class="empty">gerade offline</p></div>'; continue; }
    const kids=Object.values(saves).filter(S=>S&&S.cards&&S.playerName).sort((a,b)=>(b.lastDay||0)-(a.lastDay||0));
    html+='<div class="group"><h2>'+esc(g.name)+'</h2><div class="links"><a href="../'+g.folder+'/">Schüler-Link</a><a href="../'+g.folder+'/index_lehrer.html">Lehrerversion (Stufen testen)</a></div>'
      +focusHtml(g,fo)+(kids.length?'<div class="kids">'+kids.map(k=>kidHtml(k,g)).join("")+'</div>':'<p class="empty">Noch niemand hat hier gespielt.</p>')+'</div>'; }
  root.innerHTML=html;
  root.querySelectorAll("button[data-g]").forEach(b=>b.onclick=async()=>{ const g=META.find(x=>x.id===b.dataset.g), s=+b.dataset.s, url=DB+g.lbPath+"/_focus.json";
    try{ if(s) await fetch(url,{method:"PUT",body:JSON.stringify({stage:s,name:b.dataset.n,until:today()+14})}); else await fetch(url,{method:"DELETE"}); load(); }
    catch(e){ alert("Speichern hat nicht geklappt."); } }); }
load();
</script>
</body></html>
