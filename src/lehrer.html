<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lehrer-Übersicht</title>
<style>
  :root{ --der:#2D6CDF; --die:#E0467C; --das:#1FA85C; --bg:#F4F6FB; --card:#fff; --ink:#1F2A44; --muted:#7A86A1; --warn:#C77F0E; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink);}
  main{max-width:860px; margin:0 auto; padding:16px;}
  h1{font-size:24px; margin:8px 0 4px;} .sub{color:var(--muted); font-size:14px; margin:0 0 16px;}
  .group{background:var(--card); border-radius:16px; padding:16px; margin:0 0 16px; box-shadow:0 2px 8px rgba(31,42,68,.06);}
  .group h2{font-size:19px; margin:0 0 4px;} .links{font-size:13px; margin:0 0 10px;} .links a{color:var(--der); margin-right:12px;}
  .focus{background:#f2f6ff; border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:14px;}
  .focus b{display:block; margin-bottom:6px;} .btns{display:flex; flex-wrap:wrap; gap:6px;}
  button{border:none; border-radius:10px; padding:7px 11px; font:inherit; font-size:13px; font-weight:700; background:#e7ebf5; color:var(--ink); cursor:pointer;}
  button.on{background:var(--der); color:#fff;}
  .kids{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px;}
  .kid{border:1px solid #e7ebf5; border-radius:12px; padding:12px; font-size:14px;}
  .kid .n{font-size:17px; font-weight:800;} .kid .row{display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dashed #eef0f6;}
  .kid .row span:first-child{color:var(--muted);} .warn{color:var(--warn); font-weight:700;}
  .prob{margin-top:6px; font-size:13px; color:var(--muted);} .empty{color:var(--muted); font-size:14px;}
  .detail{margin-top:14px;} .detail h3{font-size:16px; margin:16px 0 6px;}
  .detail table{width:100%; border-collapse:collapse; font-size:13px;} .detail th,.detail td{text-align:left; padding:5px 6px; border-bottom:1px solid #eef0f6; vertical-align:top;}
  .detail th{color:var(--muted); font-weight:700;} .detail .num{text-align:right; white-space:nowrap;} .detail tr.nicht td{color:var(--warn);}
  .detail .words{font-size:13px; line-height:1.6;} .detail details{margin-top:6px; font-size:13px;} .detail .hint{color:var(--muted); font-size:12px; margin:4px 0 0;}
  .chat .tag{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-weight:700;} .chat .m{display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid #eef0f6; font-size:14px;}
  .chat .m .wer{font-weight:800; min-width:64px;} .chat .m .zt{color:var(--muted); font-size:12px; min-width:40px;} .chat .m .tx{flex:1; overflow-wrap:anywhere;} .chat .m button{padding:4px 8px; font-size:12px;}
</style></head>
<body><main>
<h1 id="titel">Lehrer-Übersicht</h1>
<p class="sub" id="untertitel">Alle Schüler aller Gruppen. Daten aus der Online-Sicherung, Stand beim Öffnen der Seite.</p>
<div id="root">lädt ...</div>
<div class="group" id="kyla"><h2>Kyla · Englisch</h2><div class="links"><a href="../english/lehrer.html">Sätze ansehen und korrigieren</a><a href="../english/">Kylas App</a></div></div>
</main>
<script>
"use strict";
const META=%%META%%;
const DB="https://ddd-spiel-default-rtdb.europe-west1.firebasedatabase.app/";
// ?g=<gruppe>: nur diese Gruppe zeigen (Link fuer Kollegen, z. B. Julian: lehrer/?g=elinor; Mike 2026-10-26); ohne Schueler-Link, damit niemand als das Kind in die echte Datenbank uebt
const NUR=new URLSearchParams(location.search).get("g"), GRUPPEN=NUR?META.filter(g=>g.id===NUR||g.folder===NUR):META;
if(NUR){ const k=document.getElementById("kyla"); if(k) k.remove(); document.getElementById("titel").textContent="Lehrer-Übersicht"+(GRUPPEN[0]?": "+GRUPPEN[0].name:"");
  document.getElementById("untertitel").textContent=GRUPPEN.length?"Daten aus der Online-Sicherung, Stand beim Öffnen der Seite.":"Diese Gruppe gibt es nicht."; }
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
const esc=s=>String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const KIND={b:"Bedeutung",ab:"Abkürzung",g:"Artikel",p:"Plural",w:"Wo/Wohin",d:"Dativ",a:"Akkusativ",m:"Fall gemischt",pr:"er/sie/es",po:"mein/meine",ps:"sein/ihr",pa:"ihn/sie/es",adj:"Adjektiv",pf:"Perfekt",pt:"Präteritum",vp:"Präsens",vm:"Modalverb",ns:"Nebensatz",ko:"Komparativ",t21:"Satzbau",t22:"mir/mich",t23:"reflexiv",t24:"Konjunktiv II",t25:"Relativsatz"};
function label(id){ const p=id.split(":"), k=p[0], t=KIND[k]||k;
  if(/^t\d+$/.test(k)) return t+"-Satz";   // Satzkarten: ID ist eine Pruefsumme
  if(k==="adj") return p[4]+" "+p[5]+" ("+t+")"; if(k==="ns") return t+" "+(+p[1]+1); if(k==="ko") return p[1]+" ("+(p[2]==="S"?"Superlativ":"Komparativ")+")";
  return p[p.length-1]+" ("+t+")"; }
function kidHtml(S,g){ const WEG=(g&&g.weg)||[];   // entfernte Themen dieser Gruppe (src/tests/entfernt.txt) nicht mitzaehlen
  const t=today(), cards=Object.entries(S.cards||{}).filter(([id])=>!WEG.some(w=>w.endsWith("$")?id===w.slice(0,-1):id.startsWith(w))), sicher=cards.filter(([,c])=>(c.box||0)>=4).length;
  const st=S.stats||{}, acc=st.attempts?Math.round(100*st.firstRight/st.attempts)+" %":"–";
  const log=(Array.isArray(S.log)?S.log:Object.values(S.log||{})).filter(L=>L&&L.d>t-7), n7=log.reduce((a,L)=>a+L.n,0), ok7=log.reduce((a,L)=>a+L.ok,0);
  const lastD=Math.max(S.lastDay!=null?S.lastDay:-1,...(Array.isArray(S.log)?S.log:Object.values(S.log||{})).filter(Boolean).map(L=>L.d||-1)), ago=lastD>=0?t-lastD:null,   /* auch abgebrochene Runden zaehlen */ agoTxt=ago==null?"noch nie":ago===0?"heute":ago===1?"gestern":"vor "+ago+" Tagen";
  const prob=cards.filter(([,c])=>(c.miss||0)>=2).sort((a,b)=>b[1].miss-a[1].miss).slice(0,6).map(([id,c])=>esc(label(id))+" ("+c.miss+")");
  const row=(k,v,w)=>'<div class="row"><span>'+k+'</span><span'+(w?' class="warn"':'')+'>'+v+'</span></div>';
  return '<div class="kid"><div class="n">'+esc(S.playerName)+'</div>'
    +row("zuletzt geübt",agoTxt,ago==null||ago>3)
    +row("letzte 7 Tage",S.log?(log.length+" Tage, "+n7+" Karten"+(n7?", "+Math.round(100*ok7/n7)+" %":"")):"(noch keine Tagesdaten)",S.log&&log.length<3)
    +row("Übungstage gesamt",S.streak||0)+row("Karten gesehen / sicher",cards.length+" / "+sicher)+row("Treffer 1. Versuch gesamt",acc)
    +(prob.length?'<div class="prob">Hängt: '+prob.join(", ")+'</div>':"")+'</div>'; }
// Detailansicht (nur mit ?g=, fuer Julian; Mike 2026-10-26): Uebungstagebuch, Themen, Wortlisten. Daten: S.log (pro Tag d, n Karten, ok Treffer 1. Versuch, f falsche Karten, a/b erste/letzte Antwort), S.cards (box, miss)
const WT=["So","Mo","Di","Mi","Do","Fr","Sa"];
function tagTxt(d){ const x=new Date(d*86400000); return WT[x.getUTCDay()]+" "+x.getUTCDate()+"."+(x.getUTCMonth()+1)+"."; }
function uhr(ms){ const x=new Date(ms); return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0"); }
function wort(id){ return esc(id.split(":").slice(1).join(":")); }
function detailHtml(S,g){ const WEG=(g&&g.weg)||[], t=today();
  const logs=(Array.isArray(S.log)?S.log:Object.values(S.log||{})).filter(L=>L&&L.d!=null), byD={}; logs.forEach(L=>byD[L.d]=L);
  let h='<div class="detail"><h3>Übungstagebuch (letzte 4 Wochen)</h3>';
  if(!logs.length) h+='<p class="empty">Noch keine Übungstage.</p>';
  else { const von=Math.max(t-27,Math.min(...logs.map(L=>L.d))); h+='<table><tr><th>Tag</th><th>Uhrzeit</th><th class="num">Karten</th><th class="num">richtig</th><th>falsch</th></tr>';
    for(let d=t; d>=von; d--){ const L=byD[d];
      if(!L){ h+='<tr class="nicht"><td>'+tagTxt(d)+'</td><td colspan="4">nicht geübt</td></tr>'; continue; }
      const min=L.a&&L.b?Math.max(1,Math.round((L.b-L.a)/60000)):null, f=Array.isArray(L.f)?L.f:Object.values(L.f||{});
      h+='<tr><td>'+tagTxt(d)+'</td><td>'+(L.a?uhr(L.a)+(min?" ("+min+" Min.)":""):"")+'</td><td class="num">'+(L.n||0)+'</td><td class="num">'+(L.n?Math.round(100*(L.ok||0)/L.n)+" %":"–")+'</td><td>'+(f.length?f.map(wort).join(", "):"–")+'</td></tr>'; }
    h+='</table><p class="hint">Uhrzeit in deiner Zeitzone. „richtig“ = im ersten Versuch richtig. „falsch“ = an dem Tag mindestens einmal falsch.</p>'; }
  const cards=Object.entries(S.cards||{}).filter(([id])=>!WEG.some(w=>w.endsWith("$")?id===w.slice(0,-1):id.startsWith(w))), th={};
  cards.forEach(([id,c])=>{ const k=id.split(":")[0], o=th[k]||(th[k]={n:0,s:0,w:0}); o.n++; if((c.box||0)>=4) o.s++; if((c.miss||0)>=1) o.w++; });
  h+='<h3>Themen</h3>'+(cards.length?'<table><tr><th>Thema</th><th class="num">gesehen</th><th class="num">sicher</th><th class="num">wackelig</th></tr>'
    +Object.entries(th).map(([k,o])=>'<tr><td>'+esc(KIND[k]||k)+'</td><td class="num">'+o.n+'</td><td class="num">'+o.s+'</td><td class="num">'+o.w+'</td></tr>').join("")+'</table><p class="hint">sicher = mehrmals hintereinander richtig, mit wachsendem Abstand. wackelig = zuletzt falsch, wird noch geübt.</p>':'<p class="empty">Noch keine Karten.</p>');
  const prob=cards.filter(([,c])=>(c.miss||0)>=1).sort((a,b)=>b[1].miss-a[1].miss), sich=cards.filter(([,c])=>(c.box||0)>=4).sort((a,b)=>a[0].localeCompare(b[0]));
  h+='<h3>Wörter, die noch nicht sitzen ('+prob.length+')</h3><div class="words">'+(prob.length?prob.map(([id,c])=>esc(label(id))+(c.miss>=2?" <b>×"+c.miss+"</b>":"")).join(", "):"keine")+'</div>';
  h+='<details><summary>Sichere Wörter ('+sich.length+')</summary><div class="words">'+(sich.length?sich.map(([id])=>esc(label(id))).join(", "):"noch keine")+'</div></details></div>';
  return h; }
function focusHtml(g,fo){ const cur=(fo&&fo.stage&&fo.until>=today())?fo:null;   // nur anzeigen: Schwerpunkte setzt nur Mike ueber Claude Code (Mike 2026-10-31)
  return '<div class="focus"><b>Schwerpunkt: '+(cur?esc(cur.name)+" (noch "+(cur.until-today())+" Tage)":"keiner")+'</b></div>'; }
// Kyana-Gruppe liegt direkt in save/: nur ihre Spielstaende laden, nicht die Unterordner anderer Gruppen (save/__…, z. B. Kylas Tonaufnahmen)
async function holeSaves(p){ const j=async u=>(await fetch(DB+u+(u.includes("?")?"&":"?")+"t="+Date.now())).json();
  if(p!=="save") return (await j(p+".json"))||{};
  const keys=Object.keys((await j("save.json?shallow=true"))||{}).filter(k=>!k.startsWith("__")), o={};
  await Promise.all(keys.map(async k=>{ o[k]=await j("save/"+encodeURIComponent(k)+".json"); })); return o; }
async function load(){ const root=document.getElementById("root"); let html="";
  for(const g of GRUPPEN){ let saves={}, fo=null;
    try{ saves=await holeSaves(g.savePath); fo=await (await fetch(DB+g.lbPath+"/_focus.json?t="+Date.now())).json(); }catch(e){ html+='<div class="group"><h2>'+esc(g.name)+'</h2><p class="empty">gerade offline</p></div>'; continue; }
    const kids=Object.values(saves).filter(S=>S&&S.cards&&S.playerName).sort((a,b)=>(b.lastDay||0)-(a.lastDay||0));
    html+='<div class="group"><h2>'+esc(g.name)+'</h2><div class="links">'+(NUR?'':'<a href="../'+g.folder+'/">Schüler-Link</a>')+'<a href="../'+g.folder+'/index_lehrer.html">Lehrerversion (Stufen testen)</a></div>'
      +focusHtml(g,fo)+(kids.length?'<div class="kids"'+(NUR?' style="display:block"':'')+'>'+kids.map(k=>kidHtml(k,g)+(NUR?detailHtml(k,g):"")).join("")+'</div>':'<p class="empty">Noch niemand hat hier gespielt.</p>')+'</div>'; }
  root.innerHTML=html;
}
load();
// Klassen-Chat (Mike 2026-10-30): alle Tage ansehen, einzelne Nachrichten loeschen. Die Kinder sehen nur den heutigen Tag. Nicht im Kollegen-Link (?g=).
const CHATS=[...new Set(META.map(g=>g.chat&&g.chat.pfad).filter(Boolean))];
async function chatLaden(pfad,box,tag){ const j=async u=>{ const r=await fetch(DB+u+(u.includes("?")?"&":"?")+"t="+Date.now()); if(!r.ok) throw 0; return r.json(); };
  let tage=[], o={};
  try{ tage=Object.keys((await j(pfad+".json?shallow=true"))||{}).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
    if(tag==null) tag=tage.length?tage[tage.length-1]:today(); o=(await j(pfad+"/"+tag+".json"))||{}; }catch(e){ box.innerHTML='<p class="empty">gerade offline</p>'; return; }
  const i=tage.indexOf(tag), vor=i>0?tage[i-1]:(i<0?tage.filter(d=>d<tag).pop():null), nach=i>=0?(i<tage.length-1?tage[i+1]:null):(tage.find(d=>d>tag)??null);
  const ms=Object.entries(o).filter(([k,m])=>m&&typeof m==="object").sort((a,b)=>(+a[1].z||0)-(+b[1].z||0));
  box.innerHTML='<div class="tag"><button data-d="'+(vor==null?"":vor)+'"'+(vor==null?" disabled":"")+'>‹</button>'+tagTxt(tag)+(tag===today()?" (heute)":"")+' · '+ms.length+(ms.length===1?' Nachricht':' Nachrichten')+'<button data-d="'+(nach==null?"":nach)+'"'+(nach==null?" disabled":"")+'>›</button></div>'
    +(ms.length?ms.map(([k,m])=>'<div class="m"><span class="zt">'+(m.z?uhr(+m.z):"")+'</span><span class="wer">'+esc(m.n)+'</span><span class="tx">'+esc(m.t)+'</span><button data-k="'+esc(k)+'">löschen</button></div>').join(""):'<p class="empty">An diesem Tag hat niemand geschrieben.</p>');
  box.querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>{ if(b.dataset.d!=="") chatLaden(pfad,box,+b.dataset.d); });
  box.querySelectorAll("button[data-k]").forEach(b=>b.onclick=async()=>{ if(!confirm("Diese Nachricht für alle löschen?")) return;
    try{ const r=await fetch(DB+pfad+"/"+tag+"/"+encodeURIComponent(b.dataset.k)+".json",{method:"DELETE"}); if(!r.ok) throw 0; chatLaden(pfad,box,tag); }catch(e){ alert("Löschen hat nicht geklappt."); } }); }
if(!NUR) CHATS.forEach(pfad=>{ const namen=META.filter(g=>g.chat&&g.chat.pfad===pfad).map(g=>g.chat.name).join(", ");
  const d=document.createElement("div"); d.className="group chat"; d.innerHTML='<h2>Klassen-Chat</h2><div class="links" style="color:var(--muted)">'+esc(namen)+'</div><div class="box">lädt ...</div>';
  const k=document.getElementById("kyla"); k.parentNode.insertBefore(d,k); chatLaden(pfad,d.querySelector(".box")); });
</script>
</body></html>
